[package]
name = "thdmaker"
version = "0.0.5"
authors = ["fn-a <mr.fna.co@gmail.com>"]
edition = "2024"
repository = "https://github.com/fn-a/thdmaker"
description = "A comprehensive 3D file format library supporting AMF, STL, 3MF and other 3D manufacturing formats"
license = "MIT"

[workspace]
members = [
    ".",
    "crates/thdfiler",
    "crates/thdslicer",
    "crates/thdviewer",
]
resolver = "2"

[dependencies]
glob = "^0.3"
thdfiler = { workspace = true }
thdslicer = { workspace = true }
thdviewer = { workspace = true }
bevy = { workspace = true }

[dependencies.clap]
version = "^4.5"
features = ["derive"]

[workspace.dependencies]
bevy = { version = "^0.19", features = ["bevy_dev_tools"] }
bevy_asset = { version = "^0.19" }
bevy_color = { version = "^0.19" }
bevy_math = { version = "^0.19" }
bevy_mesh = { version = "^0.19" }
glam = { version = "^0.32" }
thiserror = { version = "^2.0" }
thdfiler = { path = "crates/thdfiler", version = "0.0.5" }
thdslicer = { path = "crates/thdslicer", version = "0.0.5" }
thdviewer = { path = "crates/thdviewer", version = "0.0.5" }
